error_log  logs/error.log;
daemon off;

events {

}

http {

	server {

	listen 80;
	listen 443 ssl;

	ssl_certificate ssl/cert.pem;
	ssl_certificate_key ssl/key.pem;

	root site;
	server_name	localhost;
	access_log	logs/access.log;
	error_log	logs/error.log;

	index index.html index.htm index.m3u8 index.mpd;

	location /recordings {
		autoindex on;
		alias recordings;
	}


	location /stats {
        rtmp_stat all;
        rtmp_stat_stylesheet stat.xsl;
		add_header Refresh "3; $request_uri";
        }


	}

}


# https://github.com/arut/nginx-rtmp-module/wiki/Directives
rtmp {
    server {
	listen 1936;
	chunk_size 4096;

		application live {
			live on;
		}

		application live2 {
			live on;
			allow publish 127.0.0.1;
			allow play 	100.64.128.0/21;
			deny play all;
			deny publish all;

			record all;
			record_path recordings;
			record_suffix .flv;

		}

		application final {
			live on;
			push rtmp://147.229.149.180/final/ilgnerp;
		}

	}
	
}

stream {
 upstream backend {
 server 127.0.0.1:1936;
 }
 server {
 listen 1935 ssl;
 proxy_pass backend;
 ssl_certificate ssl/cert.pem;
 ssl_certificate_key ssl/key.pem;
 }
}
