# =============================================================================
#  MDS Live Studio – nginx + nginx-rtmp-module
# =============================================================================

error_log  logs/error.log;
daemon off;
worker_processes  1;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024; # max počet připojených uživatelů
}


# =============================================================================
#  RTMP – příjem programu z OBS, transkódování a tvorba HLS
# =============================================================================
rtmp {
    server {
        # Jen localhost: OBS i FFmpeg běží na stejném stroji, takže RTMP nemá
        # důvod být vidět ze sítě (obrana i pro případ, že by selhaly allow/deny).
        listen      127.0.0.1:1935;

        # Velikost RTMP chunků. Větší = menší režie u vysokých bitrate.
        chunk_size  4096;

        # Odpojí publishera, který přestal posílat data (např. zamrzlé OBS),
        # aby nezůstal viset „mrtvý“ stream a FFmpeg na něm.
        drop_idle_publisher  10s;

        # ---------------------------------------------------------------------
        #  application program
        #  Vyhrazený endpoint POUZE pro výstup centrálního OBS
        #  OBS: server rtmp://127.0.0.1:1935/program, klíč "live"
        # ---------------------------------------------------------------------
        application program {
            live  on;

            # Publikovat smí jen lokální OBS. Přehrávat nesmí nikdo – surový
            # program je jen vstup pro transkódování, divák dostává HLS.
            allow publish 127.0.0.1;
            deny  publish all;
            deny  play    all;

            # Při ukončení publikace pošli FFmpegu SIGTERM (místo SIGKILL),
            # ať korektně uzavře výstupy.
            exec_kill_signal  term;

            # exec_push: spustí příkaz, když OBS začne publikovat, a ukončí ho,
            # když přestane. $name = klíč streamu ("live").
            #
            # Jeden vstup -> 3 kvalitativní varianty, každá jako samostatný
            # RTMP stream zpět do application hls (live_1080p/_720p/_480p).
            #
            # Proč přes bash -c: nginx-rtmp nespouští příkaz přes shell, takže
            # přesměrování "2>>log" by jinak nefungovalo. "exec" nahradí shell
            # FFmpegem, aby SIGTERM od nginx dostal přímo FFmpeg.
            #
            # h264_videotoolbox = HW enkódování na macOS (doporučení zadání).
            #   Bez HW: libx264 -preset veryfast -tune zerolatency
            #   NVIDIA:  h264_nvenc
            # -g 60 při 30 fps = klíčový snímek každé 2 s. Musí sedět na
            #   hls_fragment, jinak segmenty nejdou čistě řezat a varianty
            #   nejdou plynule přepínat.
            # -maxrate/-bufsize drží bitrate blízko hodnot v hls_variant, takže
            #   ABR v přehrávači vybírá podle reality.
            exec_push bash -c "exec ffmpeg -hide_banner -loglevel warning
                -i rtmp://127.0.0.1:1935/program/$name

                -map 0:v -map 0:a -vf scale=-2:1080 -r 30
                -c:v h264_videotoolbox -b:v 5000k -maxrate 5000k -bufsize 10000k -g 60
                -c:a aac -b:a 160k -ar 48000
                -f flv rtmp://127.0.0.1:1935/hls/$name_1080p

                -map 0:v -map 0:a -vf scale=-2:720 -r 30
                -c:v h264_videotoolbox -b:v 2800k -maxrate 2800k -bufsize 5600k -g 60
                -c:a aac -b:a 128k -ar 48000
                -f flv rtmp://127.0.0.1:1935/hls/$name_720p

                -map 0:v -map 0:a -vf scale=-2:480 -r 30
                -c:v h264_videotoolbox -b:v 1200k -maxrate 1200k -bufsize 2400k -g 60
                -c:a aac -b:a 96k -ar 48000
                -f flv rtmp://127.0.0.1:1935/hls/$name_480p

                2>>logs/ffmpeg.log";
        }

        # ---------------------------------------------------------------------
        #  application hls
        #  Přijímá transkódované varianty od FFmpegu a dělá z nich adaptivní HLS.
        # ---------------------------------------------------------------------
        application hls {
            live  on;

            # Publikovat smí jen lokální FFmpeg, RTMP přehrávání není potřeba.
            allow publish 127.0.0.1;
            deny  publish all;
            deny  play    all;

            # Začni segment až klíčovým snímkem a zahoď audio před prvním
            # videem.
            wait_key    on;
            wait_video  on;

            hls  on;

            # Kam se zapisují playlisty a .ts segmenty. Stejnou složku servíruje
            # HTTP blok na /hls/ (root temp).
            hls_path  temp/hls;

            # Každá varianta ve vlastní podsložce:
            #   temp/hls/live.m3u8                 <- master playlist
            #   temp/hls/live_720p/index.m3u8 + *.ts
            hls_nested  on;

            # 2 s segmenty × ~6 v playlistu = rozumný kompromis mezi zpožděním
            # (~6–10 s) a odolností vůči výkyvům sítě.
            hls_fragment         2s;
            hls_playlist_length  12s;

            # Mazat staré segmenty, ať temp/ neroste do nekonečna.
            hls_cleanup  on;

            # Master playlist: nginx sloučí streamy se stejným základem jména
            # (live_1080p, live_720p, live_480p) do live.m3u8.
            # BANDWIDTH = video + audio + rezerva, podle toho volí přehrávač kvalitu.
            hls_variant _1080p  BANDWIDTH=5300000,RESOLUTION=1920x1080;
            hls_variant _720p   BANDWIDTH=3000000,RESOLUTION=1280x720;
            hls_variant _480p   BANDWIDTH=1350000,RESOLUTION=854x480;
        }
    }
}


# =============================================================================
#  HTTP – web pro diváky, režie, HLS a proxy na backend
# =============================================================================
http {
    include       mime.types;
    default_type  application/octet-stream;

    # Neprozrazuj verzi nginx v hlavičkách a chybových stránkách.
    server_tokens  off;

    access_log  logs/access.log;

    # Efektivní posílání souborů (HLS segmenty) přímo z kernelu.
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # API přijímá jen malé JSONy, větší požadavek je chyba nebo útok.
    client_max_body_size  1m;

    # Pro WebSocket proxy: když klient žádá o Upgrade, pošli backendu
    # "Connection: upgrade", jinak spojení normálně zavři.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # -------------------------------------------------------------------------
    #  HTTP :80 – jen přesměrování na HTTPS (zadání vyžaduje HTTPS)
    # -------------------------------------------------------------------------
    server {
        listen       80;
        server_name  _;
        return 301   https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    #  HTTPS :443 – vše ostatní
    # -------------------------------------------------------------------------
    server {
        listen       443 ssl;
        # HTTP/2 = víc paralelních požadavků (segmenty, náhledy) po jednom spojení.
        # nginx < 1.25.1 tuhle direktivu nezná, pak místo ní: listen 443 ssl http2;
        http2        on;
        server_name  _;

        # Self-signed certifikát z scripts/gen-cert.sh.
        # Cesty jsou relativní ke složce conf/.
        ssl_certificate      ssl/cert.pem;
        ssl_certificate_key  ssl/key.pem;

        # TLS.  
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1h;

        # Základní bezpečnostní hlavičky:
        #  - nosniff: prohlížeč nesmí hádat typ souboru
        #  - SAMEORIGIN: stránky nejdou vložit do cizího iframe (clickjacking)
        add_header X-Content-Type-Options  nosniff        always;
        add_header X-Frame-Options         SAMEORIGIN     always;
        add_header Referrer-Policy         same-origin    always;

        # Statický web (divácká stránka + režie) – nginx/site/
        root   site;
        index  index.html;

        # ---------------------------------------------------------------------
        #  /  – divácká stránka (veřejná)
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ =404;
        }

        # ---------------------------------------------------------------------
        #  /director/  – režisérská aplikace (chráněná heslem)
        # ---------------------------------------------------------------------
        location /director/ {
            auth_basic            "MDS – rezie";
            auth_basic_user_file  .htpasswd;        # conf/.htpasswd
            # SPA: neznámé cesty vrátí index.html, routování řeší JS.
            try_files $uri $uri/ /director/index.html;
        }

        # ---------------------------------------------------------------------
        #  /api/  – REST API backendu (Node.js na 127.0.0.1:3000)
        #  Backend poslouchá jen na localhostu, ven je vidět jen přes tuto proxy,
        #  která navíc vynucuje stejné heslo jako režie.
        # ---------------------------------------------------------------------
        location /api/ {
            auth_basic            "MDS – rezie";
            auth_basic_user_file  .htpasswd;

            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  https;
        }

        # ---------------------------------------------------------------------
        #  /ws  – WebSocket backendu (náhledy, stav zdrojů, failover události)
        #  Prohlížeč posílá u WS handshake na stejný origin uložené Basic Auth
        #  údaje, takže ochrana funguje i tady.
        # ---------------------------------------------------------------------
        location /ws {
            auth_basic            "MDS – rezie";
            auth_basic_user_file  .htpasswd;

            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;                       
            proxy_set_header   Upgrade     $http_upgrade;
            proxy_set_header   Connection  $connection_upgrade;
            proxy_set_header   Host        $host;

            # Výchozí timeout je 60 s, nečinné WS spojení by se zavřelo.
            # Režie bývá otevřená celé vysílání.
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }

        # ---------------------------------------------------------------------
        #  /hls/  – HLS stream pro diváky (veřejný)
        #  root temp => /hls/live.m3u8 se čte z temp/hls/live.m3u8,
        #  tedy ze stejné složky, kam zapisuje hls_path.
        # ---------------------------------------------------------------------
        location /hls/ {
            root  temp;

            # Explicitní typy pro jistotu, ať přehrávač dostane správný MIME
            # i bez úplného mime.types.
            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
            }

            # CORS: dovolí přehrát stream i z jiného originu (testování
            # v externích přehrávačích, např. hls.js demo).
            add_header Access-Control-Allow-Origin  *  always;

            # Playlisty se mění každé 2 s, nesmí se cachovat. Jinak divák
            # zamrzne na starém playlistu nebo nepozná, že vysílání začalo.
            location ~ \.m3u8$ {
                add_header Cache-Control  "no-cache, no-store"  always;
                add_header Access-Control-Allow-Origin  *  always;
            }

            # Segmenty se po vytvoření nemění, krátká cache je bezpečná
            # a ulehčí serveru.
            location ~ \.ts$ {
                add_header Cache-Control  "public, max-age=30"  always;
                add_header Access-Control-Allow-Origin  *  always;
            }
        }

        # ---------------------------------------------------------------------
        #  /stat  – statistiky nginx-rtmp (kdo publikuje, bitrate, klienti)
        # ---------------------------------------------------------------------
        location = /stat {
            rtmp_stat  all;
            allow      127.0.0.1;
            deny       all;
        }
    }
}
