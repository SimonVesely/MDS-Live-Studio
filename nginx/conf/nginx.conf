# MDS demo – nginx (spouštět ze složky nginx/)
daemon off;
worker_processes 1;
events { worker_connections 1024; }

rtmp {
    server {
        listen 127.0.0.1:1935;

        # Sem vysílá OBS: server rtmp://127.0.0.1/program, klíč "live"
        application program {
            live on;
            on_publish      http://127.0.0.1:3000/rtmp/start;  # backend spustí FFmpeg
            on_publish_done http://127.0.0.1:3000/rtmp/stop;   # backend ho zastaví
        }

        # Sem posílá FFmpeg 3 kvality, nginx z nich dělá HLS
        application hls {
            live on;
            hls on;
            hls_path temp/hls;
            hls_nested on;
            hls_fragment 2s;
            hls_variant _1080p BANDWIDTH=5300000,RESOLUTION=1920x1080;
            hls_variant _720p  BANDWIDTH=3000000,RESOLUTION=1280x720;
            hls_variant _480p  BANDWIDTH=1350000,RESOLUTION=854x480;
        }
    }
}

http {
    include mime.types;

    server {
        listen 443 ssl;
        ssl_certificate     ssl/cert.pem;
        ssl_certificate_key ssl/key.pem;

        root site;               # divácká stránka (site/index.html)

        location /hls/ {         # HLS stream: https://localhost/hls/live.m3u8
            root temp;
            add_header Cache-Control no-cache;
        }
    }
}
